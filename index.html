<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Mit Vergnügen" />
  <meta name="description" content="Mit Vergnügen Berlin – dein Freund in der Großstadt. Die besten Tipps zum Essen, Trinken, Ausgehen und Erleben." />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <title>Mit Vergnügen Berlin</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <style>
    :root {
      /* Mit-Vergnügen-inspirierte Palette: clean weiß, kräftiges Schwarz, Signature-Pink */
      --bg: #ffffff;
      --surface: #ffffff;
      --surface-2: #f7f6f4;
      --text: #14110f;
      --text-muted: #6f6a64;
      --border: #ececea;
      --accent: #ff1f5e;        /* Signature-Pink */
      --accent-dark: #e00049;
      --accent-soft: #fff0f4;
      --yellow: #ffd23f;
      --shadow: 0 8px 30px rgba(20, 17, 15, 0.08);
      --radius: 18px;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --nav-h: 64px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    html, body { height: 100%; }

    body {
      background: var(--surface-2);
      color: var(--text);
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
      overscroll-behavior-y: none;
    }

    /* ---------- App-Rahmen (Phone-Feel auf Desktop) ---------- */
    .app {
      position: relative;
      max-width: 480px;
      margin: 0 auto;
      min-height: 100vh;
      min-height: 100dvh;
      background: var(--bg);
      box-shadow: 0 0 60px rgba(0,0,0,0.08);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ---------- Header ---------- */
    header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(255,255,255,0.92);
      backdrop-filter: saturate(180%) blur(12px);
      -webkit-backdrop-filter: saturate(180%) blur(12px);
      border-bottom: 1px solid var(--border);
      padding: calc(var(--safe-top) + 12px) 18px 12px;
    }
    .header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    /* Logo-Schriftzug "mit Vergnügen" (CSS-Rekonstruktion) */
    .logo {
      display: inline-flex;
      align-items: baseline;
      gap: 5px;
      font-family: 'Fraunces', Georgia, serif;
      line-height: 1;
      cursor: pointer;
      user-select: none;
    }
    .logo .mit {
      font-weight: 600;
      font-size: 1.02rem;
      font-style: italic;
      color: var(--text);
    }
    .logo .verg {
      font-weight: 900;
      font-size: 1.5rem;
      letter-spacing: -0.5px;
      color: var(--text);
    }
    .logo .dot { color: var(--accent); }

    .icon-btn {
      width: 40px; height: 40px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: var(--surface);
      display: grid; place-items: center;
      cursor: pointer;
      color: var(--text);
      transition: background .15s, transform .1s;
    }
    .icon-btn:active { transform: scale(0.92); }
    .icon-btn svg { width: 20px; height: 20px; }

    /* Stadt-Wähler */
    .city-pill {
      display: inline-flex; align-items: center; gap: 5px;
      background: var(--text); color: #fff;
      font-size: 0.78rem; font-weight: 700;
      padding: 6px 12px; border-radius: 999px;
      border: none; cursor: pointer;
    }
    .city-pill svg { width: 13px; height: 13px; }

    /* Suche */
    .search {
      margin-top: 12px;
      display: flex; align-items: center; gap: 10px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 11px 14px;
    }
    .search svg { width: 18px; height: 18px; color: var(--text-muted); flex: none; }
    .search input {
      border: none; background: none; outline: none;
      font-size: 0.95rem; width: 100%; color: var(--text);
      font-family: inherit;
    }

    /* ---------- Scroll-Bereich ---------- */
    main {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
      padding-bottom: calc(var(--nav-h) + var(--safe-bottom) + 16px);
    }
    .page { display: none; animation: fade .25s ease; }
    .page.active { display: block; }
    @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

    .section { padding: 20px 18px 4px; }
    .section-head {
      display: flex; align-items: baseline; justify-content: space-between;
      margin-bottom: 14px;
    }
    .section-head h2 {
      font-family: 'Fraunces', serif;
      font-weight: 900; font-size: 1.35rem; letter-spacing: -0.3px;
    }
    .section-head a { color: var(--accent); font-size: 0.82rem; font-weight: 700; text-decoration: none; }

    /* ---------- Kategorien-Chips ---------- */
    .chips {
      display: flex; gap: 8px; overflow-x: auto;
      padding: 14px 18px 4px;
      scrollbar-width: none;
    }
    .chips::-webkit-scrollbar { display: none; }
    .chip {
      flex: none;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-size: 0.82rem; font-weight: 600;
      padding: 8px 15px; border-radius: 999px;
      cursor: pointer; white-space: nowrap;
      transition: all .15s;
    }
    .chip.active { background: var(--text); color: #fff; border-color: var(--text); }

    /* ---------- Hero / Tipp des Tages ---------- */
    .hero {
      margin: 16px 18px 0;
      border-radius: var(--radius);
      overflow: hidden;
      position: relative;
      color: #fff;
      min-height: 230px;
      display: flex; flex-direction: column; justify-content: flex-end;
      padding: 18px;
      box-shadow: var(--shadow);
    }
    .hero::before {
      content: ""; position: absolute; inset: 0;
      background:
        linear-gradient(to top, rgba(0,0,0,0.78) 0%, rgba(0,0,0,0.05) 60%),
        var(--hero-img, linear-gradient(135deg, #ff1f5e, #ff7b3d));
      background-size: cover; background-position: center;
      z-index: 0;
    }
    .hero > * { position: relative; z-index: 1; }
    .badge {
      align-self: flex-start;
      background: var(--accent); color: #fff;
      font-size: 0.7rem; font-weight: 800; letter-spacing: 0.5px;
      text-transform: uppercase;
      padding: 5px 11px; border-radius: 999px;
      margin-bottom: 10px;
    }
    .hero h1 {
      font-family: 'Fraunces', serif;
      font-weight: 900; font-size: 1.6rem; line-height: 1.1;
      letter-spacing: -0.5px;
    }
    .hero .meta { margin-top: 8px; font-size: 0.82rem; opacity: 0.9; }

    /* ---------- Story-Reihe (horizontal) ---------- */
    .stories { display: flex; gap: 14px; overflow-x: auto; padding: 14px 18px 6px; scrollbar-width: none; }
    .stories::-webkit-scrollbar { display: none; }
    .story { flex: none; width: 72px; text-align: center; cursor: pointer; }
    .story .ring {
      width: 66px; height: 66px; border-radius: 50%;
      padding: 3px;
      background: conic-gradient(from 140deg, var(--accent), #ff7b3d, var(--yellow), var(--accent));
      display: grid; place-items: center;
    }
    .story .ring span {
      width: 100%; height: 100%; border-radius: 50%;
      background-size: cover; background-position: center;
      border: 2px solid #fff;
      display: block;
    }
    .story p { font-size: 0.7rem; margin-top: 6px; color: var(--text-muted); font-weight: 600;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* ---------- Karten (Artikel) ---------- */
    .card-scroll { display: flex; gap: 14px; overflow-x: auto; padding: 4px 18px 8px; scrollbar-width: none; }
    .card-scroll::-webkit-scrollbar { display: none; }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      cursor: pointer;
      transition: transform .12s;
    }
    .card:active { transform: scale(0.98); }
    .card .thumb {
      height: 150px; background-size: cover; background-position: center;
      position: relative;
    }
    .card.wide { flex: none; width: 250px; }
    .card .cat-tag {
      position: absolute; top: 10px; left: 10px;
      background: rgba(255,255,255,0.95); color: var(--text);
      font-size: 0.66rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.4px;
      padding: 4px 9px; border-radius: 999px;
    }
    .fav-btn {
      position: absolute; top: 9px; right: 9px;
      width: 32px; height: 32px; border-radius: 50%;
      background: rgba(255,255,255,0.92); border: none;
      display: grid; place-items: center; cursor: pointer;
    }
    .fav-btn svg { width: 17px; height: 17px; color: var(--text); }
    .fav-btn.on svg { color: var(--accent); fill: var(--accent); }
    .card .body { padding: 13px 14px 16px; }
    .card .body h3 {
      font-family: 'Fraunces', serif;
      font-weight: 600; font-size: 1.02rem; line-height: 1.22;
      letter-spacing: -0.2px;
    }
    .card .body .meta {
      margin-top: 9px; font-size: 0.74rem; color: var(--text-muted);
      display: flex; align-items: center; gap: 6px;
    }
    .dotsep { width: 3px; height: 3px; border-radius: 50%; background: var(--text-muted); display: inline-block; }

    /* Listen-Karte (Feed) */
    .list { padding: 6px 18px 0; }
    .list .card { display: flex; margin-bottom: 14px; }
    .list .card .thumb { width: 120px; min-width: 120px; height: auto; min-height: 110px; }
    .list .card .body { flex: 1; padding: 12px 13px; }
    .list .card .body h3 { font-size: 0.98rem; }

    /* ---------- Event-Karten ---------- */
    .event {
      display: flex; gap: 14px; align-items: center;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 14px; padding: 12px; margin-bottom: 12px; cursor: pointer;
    }
    .event:active { transform: scale(0.99); }
    .event .date {
      width: 56px; min-width: 56px; text-align: center;
      background: var(--accent-soft); border-radius: 12px; padding: 9px 4px;
    }
    .event .date .d { font-family: 'Fraunces', serif; font-weight: 900; font-size: 1.3rem; color: var(--accent); line-height: 1; }
    .event .date .m { font-size: 0.66rem; font-weight: 800; text-transform: uppercase; color: var(--accent-dark); margin-top: 3px; }
    .event .info h3 { font-size: 0.98rem; font-weight: 700; }
    .event .info .meta { font-size: 0.78rem; color: var(--text-muted); margin-top: 4px; }

    /* ---------- Kategorien-Grid ---------- */
    .cat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 8px 18px; }
    .cat-tile {
      border-radius: 16px; height: 110px; padding: 14px; cursor: pointer;
      display: flex; flex-direction: column; justify-content: space-between;
      color: #fff; position: relative; overflow: hidden;
      font-family: 'Fraunces', serif; font-weight: 900; font-size: 1.1rem;
      box-shadow: var(--shadow);
    }
    .cat-tile span.emoji { font-size: 1.5rem; }
    .cat-tile:active { transform: scale(0.97); }

    /* ---------- Detail-Ansicht ---------- */
    .detail { display: none; position: absolute; inset: 0; z-index: 80; background: var(--bg); flex-direction: column; }
    .detail.active { display: flex; }
    .detail-scroll { flex: 1; overflow-y: auto; padding-bottom: calc(var(--safe-bottom) + 24px); }
    .detail-hero { height: 300px; background-size: cover; background-position: center; position: relative; }
    .detail-back {
      position: absolute; top: calc(var(--safe-top) + 14px); left: 14px;
      width: 42px; height: 42px; border-radius: 50%;
      background: rgba(255,255,255,0.95); border: none; cursor: pointer;
      display: grid; place-items: center; box-shadow: var(--shadow);
    }
    .detail-back svg { width: 22px; height: 22px; }
    .detail-body { padding: 22px 20px; }
    .detail-body .cat-tag {
      display: inline-block; background: var(--accent-soft); color: var(--accent-dark);
      font-size: 0.7rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px;
      padding: 5px 11px; border-radius: 999px;
    }
    .detail-body h1 {
      font-family: 'Fraunces', serif; font-weight: 900; font-size: 1.7rem;
      line-height: 1.15; letter-spacing: -0.5px; margin: 12px 0 10px;
    }
    .detail-body .meta { font-size: 0.82rem; color: var(--text-muted); margin-bottom: 18px;
      display: flex; align-items: center; gap: 6px; }
    .detail-body p { font-size: 1rem; line-height: 1.65; color: #2b2723; margin-bottom: 16px; }
    .detail-body h3 { font-family: 'Fraunces', serif; font-size: 1.2rem; font-weight: 900; margin: 22px 0 10px; }
    .tipps li { font-size: 0.98rem; line-height: 1.55; margin: 0 0 14px 4px; padding-left: 12px;
      list-style: none; position: relative; }
    .tipps li::before { content: ""; position: absolute; left: -6px; top: 8px;
      width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }
    .tipps li b { font-weight: 800; }

    /* ---------- Empty / Favoriten ---------- */
    .empty { text-align: center; padding: 70px 30px; color: var(--text-muted); }
    .empty .big { font-size: 3rem; margin-bottom: 12px; }
    .empty h3 { font-family: 'Fraunces', serif; color: var(--text); font-size: 1.2rem; margin-bottom: 8px; }

    /* ---------- Bottom-Navigation ---------- */
    nav.tabbar {
      position: sticky; bottom: 0; z-index: 60;
      background: rgba(255,255,255,0.94);
      backdrop-filter: saturate(180%) blur(14px);
      -webkit-backdrop-filter: saturate(180%) blur(14px);
      border-top: 1px solid var(--border);
      display: flex; justify-content: space-around; align-items: center;
      height: var(--nav-h);
      padding-bottom: var(--safe-bottom);
    }
    .tab {
      flex: 1; background: none; border: none; cursor: pointer;
      display: flex; flex-direction: column; align-items: center; gap: 3px;
      color: var(--text-muted); font-size: 0.62rem; font-weight: 700;
      padding: 6px 0;
    }
    .tab svg { width: 23px; height: 23px; }
    .tab.active { color: var(--accent); }
    .tab.active svg { stroke: var(--accent); }

    /* Toast */
    .toast {
      position: fixed; left: 50%; bottom: calc(var(--nav-h) + 20px);
      transform: translateX(-50%) translateY(20px);
      background: var(--text); color: #fff; font-size: 0.85rem; font-weight: 600;
      padding: 11px 18px; border-radius: 999px; opacity: 0; pointer-events: none;
      transition: all .25s; z-index: 200; white-space: nowrap;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* Install-Hinweis */
    .install-bar {
      display: none;
      align-items: center; gap: 12px;
      margin: 16px 18px 0; padding: 13px 15px;
      background: var(--text); color: #fff; border-radius: 14px;
    }
    .install-bar.show { display: flex; }
    .install-bar p { font-size: 0.82rem; flex: 1; line-height: 1.3; }
    .install-bar button {
      background: var(--accent); color: #fff; border: none; border-radius: 999px;
      padding: 8px 14px; font-weight: 700; font-size: 0.8rem; cursor: pointer; white-space: nowrap;
    }
    .install-bar .x { background: none; padding: 4px; opacity: 0.7; }
  </style>
</head>
<body>
  <div class="app" id="app">
    <!-- ===== Header ===== -->
    <header>
      <div class="header-row">
        <div class="logo" onclick="go('home')" aria-label="Mit Vergnügen">
          <span class="mit">mit</span><span class="verg">Vergnügen<span class="dot">.</span></span>
        </div>
        <div style="display:flex; gap:8px; align-items:center;">
          <button class="city-pill" id="cityBtn" title="Stadt wechseln">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C8.1 2 5 5.1 5 9c0 5.2 7 13 7 13s7-7.8 7-13c0-3.9-3.1-7-7-7zm0 9.5A2.5 2.5 0 1112 6.5a2.5 2.5 0 010 5z"/></svg>
            <span id="cityName">Berlin</span>
          </button>
          <button class="icon-btn" onclick="toast('🔔 Keine neuen Mitteilungen')" aria-label="Mitteilungen">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 01-3.46 0"/></svg>
          </button>
        </div>
      </div>
      <div class="search" onclick="document.getElementById('searchInput').focus()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <input id="searchInput" placeholder="Restaurants, Events, Tipps suchen …" />
      </div>
    </header>

    <!-- ===== Scroll-Content ===== -->
    <main id="main">

      <!-- ===== ENTDECKEN ===== -->
      <section class="page active" id="page-home">
        <!-- Install-Hinweis (PWA) -->
        <div class="install-bar" id="installBar">
          <p>📲 Mit Vergnügen als App auf den Homescreen legen</p>
          <button onclick="doInstall()">Installieren</button>
          <button class="x" onclick="this.parentElement.classList.remove('show')">✕</button>
        </div>

        <!-- Stories -->
        <div class="stories" id="stories"></div>

        <!-- Tipp des Tages -->
        <div class="section">
          <div class="section-head"><h2>Tipp des Tages</h2></div>
        </div>
        <div class="hero" id="heroTip"></div>

        <!-- Kategorie-Chips -->
        <div class="chips" id="homeChips"></div>

        <!-- Beliebt gerade -->
        <div class="section"><div class="section-head"><h2>Gerade beliebt</h2><a onclick="go('guides')">Alle</a></div></div>
        <div class="card-scroll" id="popularScroll"></div>

        <!-- Neu im Magazin -->
        <div class="section"><div class="section-head"><h2>Neu im Magazin</h2></div></div>
        <div class="list" id="feedList"></div>
      </section>

      <!-- ===== GUIDES ===== -->
      <section class="page" id="page-guides">
        <div class="section"><div class="section-head"><h2>Guides &amp; Listen</h2></div></div>
        <div class="chips" id="guideChips"></div>
        <div class="list" id="guidesList"></div>
      </section>

      <!-- ===== EVENTS ===== -->
      <section class="page" id="page-events">
        <div class="section"><div class="section-head"><h2>Was geht in Berlin</h2></div></div>
        <div class="chips" id="eventChips"></div>
        <div class="section" style="padding-top:6px;"><div id="eventList"></div></div>
      </section>

      <!-- ===== KARTE ===== -->
      <section class="page" id="page-map">
        <div class="section"><div class="section-head"><h2>In deiner Nähe</h2></div></div>
        <div id="mapWrap" style="margin:0 18px; border-radius:var(--radius); overflow:hidden; height:240px; position:relative; box-shadow:var(--shadow); background:linear-gradient(135deg,#ffe3ec,#ffd9c4); display:grid; place-items:center;">
          <div style="text-align:center; color:#a23; font-weight:700;">
            <div style="font-size:2.2rem;">🗺️</div>
            <div style="font-size:0.85rem; margin-top:6px;">Kiez-Karte · Friedrichshain · Kreuzberg</div>
          </div>
        </div>
        <div class="section"><div class="section-head"><h2>Spots um die Ecke</h2></div></div>
        <div class="list" id="mapList"></div>
      </section>

      <!-- ===== FAVORITEN ===== -->
      <section class="page" id="page-fav">
        <div class="section"><div class="section-head"><h2>Deine Favoriten</h2></div></div>
        <div id="favList"></div>
      </section>

    </main>

    <!-- ===== Detail-Overlay ===== -->
    <div class="detail" id="detail">
      <div class="detail-scroll">
        <div class="detail-hero" id="detailHero">
          <button class="detail-back" onclick="closeDetail()" aria-label="Zurück">
            <svg viewBox="0 0 24 24" fill="none" stroke="#14110f" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
          </button>
        </div>
        <div class="detail-body" id="detailBody"></div>
      </div>
    </div>

    <!-- ===== Bottom-Nav ===== -->
    <nav class="tabbar">
      <button class="tab active" data-tab="home" onclick="go('home')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>
        Entdecken
      </button>
      <button class="tab" data-tab="guides" onclick="go('guides')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16"/><path d="M4 12h16"/><path d="M4 19h10"/></svg>
        Guides
      </button>
      <button class="tab" data-tab="events" onclick="go('events')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
        Events
      </button>
      <button class="tab" data-tab="map" onclick="go('map')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-7.2-7-12a7 7 0 0114 0c0 4.8-7 12-7 12z"/><circle cx="12" cy="9" r="2.5"/></svg>
        Karte

  const EVENT_FILTERS = [

  /* ---------- State ---------- */
  let favs = JSON.parse(localStorage.getItem('mv_favs') || '[]');
  let activeCat = 'all';
  const byId = id => ARTICLES.find(a => a.id === id);

  /* ---------- Helpers ---------- */
  function esc(s){ return (s||'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
  function isFav(id){ return favs.includes(id); }
  function toggleFav(id, e){
    if(e){ e.stopPropagation(); }
    if(isFav(id)){ favs = favs.filter(f => f !== id); toast('Aus Favoriten entfernt'); }
    else { favs.push(id); toast('❤️ Zu Favoriten hinzugefügt'); }
    localStorage.setItem('mv_favs', JSON.stringify(favs));
    renderAll();
  }
  function toast(msg){
    const t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    clearTimeout(window._tt); window._tt = setTimeout(()=>t.classList.remove('show'), 1900);
  }

  const heartSVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 5.6a5 5 0 00-7-.2L12 7l-1.8-1.6a5 5 0 10-6.8 7.2L12 21l8.6-8.4a5 5 0 00.2-7z"/></svg>';

  function articleCard(a, wide){
    return `<article class="card ${wide?'wide':''}" onclick="openDetail('${a.id}')">
      <div class="thumb" style="background-image:url('${a.img}')">
        <span class="cat-tag">${esc(a.tag)}</span>
        <button class="fav-btn ${isFav(a.id)?'on':''}" onclick="toggleFav('${a.id}', event)" aria-label="Merken">${heartSVG}</button>
      </div>
      <div class="body">
        <h3>${esc(a.title)}</h3>
        <div class="meta">${esc(a.author)} <span class="dotsep"></span> ${esc(a.read)} <span class="dotsep"></span> ${esc(a.date)}</div>
      </div>
    </article>`;
  }

  /* ---------- Renderer ---------- */
  function renderStories(){
    const items = CATS.slice(0,6);
    document.getElementById('stories').innerHTML = items.map(c => {
      const a = ARTICLES.find(x => x.cat === c.id) || ARTICLES[0];
      return `<div class="story" onclick="go('home'); filterCat('${c.id}')">
        <div class="ring"><span style="background-image:url('${a.img}')"></span></div>
        <p>${esc(c.name.split(' ')[0])}</p>
      </div>`;
    }).join('');
  }

  function renderHero(){
    const a = ARTICLES[2];
    document.getElementById('heroTip').style.setProperty('--hero-img', `url('${a.img}')`);
    document.getElementById('heroTip').innerHTML = `
      <span class="badge">Heute empfohlen</span>
      <h1>${esc(a.title)}</h1>
      <div class="meta">${esc(a.read)} Lesezeit · von ${esc(a.author)}</div>`;
    document.getElementById('heroTip').onclick = () => openDetail(a.id);
  }

  function renderChips(){
    const html = `<button class="chip ${activeCat==='all'?'active':''}" onclick="filterCat('all')">Für dich</button>` +
      CATS.map(c => `<button class="chip ${activeCat===c.id?'active':''}" onclick="filterCat('${c.id}')">${c.emoji} ${esc(c.name)}</button>`).join('');
    document.getElementById('homeChips').innerHTML = html;
  }

  function filterCat(id){ activeCat = id; renderChips(); renderPopular(); renderFeed(); }

  function filtered(){
    return activeCat === 'all' ? ARTICLES : ARTICLES.filter(a => a.cat === activeCat);
  }

  function renderPopular(){
    const list = filtered().slice(0, 6);
    document.getElementById('popularScroll').innerHTML = list.map(a => articleCard(a, true)).join('') ||
      '<p style="color:var(--text-muted); padding:0 18px;">Nichts gefunden.</p>';
  }

  function renderFeed(){
    document.getElementById('feedList').innerHTML = filtered().map(a => articleCard(a)).join('');
  }

  function renderGuides(){
    document.getElementById('guideChips').innerHTML =
      `<button class="chip ${activeCat==='all'?'active':''}" onclick="filterCatGuides('all')">Alle</button>` +
      CATS.map(c => `<button class="chip ${activeCat===c.id?'active':''}" onclick="filterCatGuides('${c.id}')">${esc(c.name)}</button>`).join('');
    const list = activeCat==='all' ? ARTICLES : ARTICLES.filter(a=>a.cat===activeCat);
    document.getElementById('guidesList').innerHTML = list.map(a => articleCard(a)).join('');
  }
  function filterCatGuides(id){ activeCat = id; renderGuides(); }

  function renderEvents(){
    document.getElementById('eventChips').innerHTML = EVENT_FILTERS.map(f =>
      `<button class="chip ${window._ef===f.id||(!window._ef&&f.id==='all')?'active':''}" onclick="filterEvents('${f.id}')">${esc(f.name)}</button>`).join('');
    const ef = window._ef || 'all';
    const list = ef==='all' ? EVENTS : EVENTS.filter(e => e.cat === ef);
    document.getElementById('eventList').innerHTML = list.map(e => `
      <div class="event" onclick="toast('🎟️ ${esc(e.title)} – im Kalender gespeichert')">
        <div class="date"><div class="d">${e.day}</div><div class="m">${esc(e.mon)}</div></div>
        <div class="info"><h3>${esc(e.title)}</h3><div class="meta">${esc(e.where)}</div></div>
      </div>`).join('');
  }
  function filterEvents(id){ window._ef = id; renderEvents(); }

  function renderMap(){
    document.getElementById('mapList').innerHTML = ARTICLES.filter(a=>['essen','ausgehen'].includes(a.cat)).slice(0,5).map(a => articleCard(a)).join('');
  }

  function renderFav(){
    const el = document.getElementById('favList');
    if(!favs.length){
      el.innerHTML = `<div class="empty"><div class="big">❤️</div><h3>Noch keine Favoriten</h3>
        <p>Tippe auf das Herz bei einem Artikel, um ihn hier zu sammeln.</p></div>`;
      return;
    }
    el.innerHTML = `<div class="list">${favs.map(id => { const a = byId(id); return a ? articleCard(a) : ''; }).join('')}</div>`;
  }

  function renderAll(){
    renderStories(); renderHero(); renderChips(); renderPopular(); renderFeed();
    renderGuides(); renderEvents(); renderMap(); renderFav();
  }

  /* ---------- Navigation ---------- */
  function go(tab){
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.getElementById('page-' + tab).classList.add('active');
    document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
    document.getElementById('main').scrollTo({ top: 0 });
    closeDetail();
  }

  /* ---------- Detail ---------- */
  function openDetail(id){
    const a = byId(id); if(!a) return;
    document.getElementById('detailHero').style.backgroundImage = `url('${a.img}')`;
    document.getElementById('detailBody').innerHTML = `
      <span class="cat-tag">${esc(a.tag)}</span>
      <h1>${esc(a.title)}</h1>
      <div class="meta">von ${esc(a.author)} <span class="dotsep"></span> ${esc(a.read)} Lesezeit <span class="dotsep"></span> ${esc(a.date)}</div>
      <p>${esc(a.intro)}</p>
      <h3>Unsere Tipps</h3>
      <ol class="tipps">${a.tipps.map((t,i)=>`<li><b>${i+1}. ${esc(t[0])}</b><br>${esc(t[1])}</li>`).join('')}</ol>
      <div style="display:flex; gap:10px; margin-top:24px;">
        <button onclick="toggleFav('${a.id}')" style="flex:1; padding:13px; border-radius:999px; border:none; cursor:pointer; font-weight:700; font-size:0.92rem; background:${isFav(a.id)?'var(--accent)':'var(--text)'}; color:#fff;">
          ${isFav(a.id)?'❤️ Gemerkt':'♡ Merken'}
        </button>
        <button onclick="shareArticle('${a.id}')" style="padding:13px 18px; border-radius:999px; border:1px solid var(--border); background:#fff; cursor:pointer; font-weight:700;">Teilen</button>
      </div>
      <p style="margin-top:28px; font-size:0.8rem; color:var(--text-muted);">© Mit Vergnügen Berlin · Demonstrations-Inhalte</p>`;
    document.getElementById('detail').classList.add('active');
    document.querySelector('.detail-scroll').scrollTo({top:0});
  }
  function closeDetail(){ document.getElementById('detail').classList.remove('active'); }

  async function shareArticle(id){
    const a = byId(id);
    const data = { title: a.title, text: a.intro, url: location.href };
    if(navigator.share){ try { await navigator.share(data); } catch(e){} }
    else { toast('🔗 Link kopiert'); try { await navigator.clipboard.writeText(location.href); } catch(e){} }
  }

  /* ---------- Suche ---------- */
  document.getElementById('searchInput').addEventListener('input', function(){
    const q = this.value.trim().toLowerCase();
    go('home');
    if(!q){ activeCat='all'; renderPopular(); renderFeed(); return; }
    const res = ARTICLES.filter(a => (a.title + a.tag + a.intro).toLowerCase().includes(q));
    document.getElementById('feedList').innerHTML = res.length
      ? res.map(a => articleCard(a)).join('')
      : `<div class="empty"><div class="big">🔍</div><h3>Nichts gefunden</h3><p>Probier’s mal mit „Frühstück", „Bar" oder „Sommer".</p></div>`;
    document.getElementById('popularScroll').innerHTML = '';
  });

  /* ---------- Stadt-Wähler ---------- */
  const CITIES = ['Berlin','Hamburg','München','Köln'];
  document.getElementById('cityBtn').addEventListener('click', () => {
    const cur = document.getElementById('cityName').textContent;
    const next = CITIES[(CITIES.indexOf(cur)+1) % CITIES.length];
    document.getElementById('cityName').textContent = next;
    toast('📍 Stadt: ' + next);
  });

  /* ---------- Kategorie-Grid in Guides (oben) ---------- */
  // (Chips übernehmen die Kategorie-Auswahl)

  /* ---------- PWA Install ---------- */
  let deferredPrompt = null;
  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault(); deferredPrompt = e;
    document.getElementById('installBar').classList.add('show');
  });
  function doInstall(){
    if(!deferredPrompt){ toast('Über das Browser-Menü „Zum Home-Bildschirm"'); return; }
    deferredPrompt.prompt();
    deferredPrompt.userChoice.finally(()=>{ deferredPrompt=null; document.getElementById('installBar').classList.remove('show'); });
  }

  if('serviceWorker' in navigator){
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(()=>{}));
  }

  /* ---------- Init ---------- */
  renderAll();
  </script>
</body>
</html>
