<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Video</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }
    #player {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover; /* Bildschirm komplett füllen, ggf. beschneiden */
      background: #000;
    }
  </style>
</head>
<body>
  <video id="player" autoplay muted playsinline preload="auto"></video>

  <script>
    // Das Video ist auf zwei Dateien aufgeteilt und wird nacheinander
    // in einer Endlosschleife abgespielt.
    var parts = ["Video 1.mov", "Video 2.mov"];
    var index = 0;
    var video = document.getElementById("player");

    function playPart(i) {
      video.src = encodeURI(parts[i]);
      video.load();
      var p = video.play();
      if (p && typeof p.catch === "function") {
        p.catch(function () { /* Autoplay ggf. verzögert */ });
      }
    }

    // Nach dem Ende eines Teils zum nächsten wechseln (endlos).
    video.addEventListener("ended", function () {
      index = (index + 1) % parts.length;
      playPart(index);
    });

    playPart(index);
  </script>
</body>
</html>
